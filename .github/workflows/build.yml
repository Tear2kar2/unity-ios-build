name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bypass Windows IL2CPP Missing Binaries
        run: |
          echo "Tạo mock dummy binary cho IL2CPP và bee_backend để Xcode vượt qua script kiểm tra..."
          # Tạo đúng cấu trúc thư mục mà Xcode đang tìm kiếm
          mkdir -p Il2CppOutputProject/IL2CPP/build/deploy_arm64/bee_backend/mac-arm64

          # Tạo file giả lập (dummy executable) báo hoàn thành thành công (exit 0)
          cat << 'EOF' > Il2CppOutputProject/IL2CPP/build/deploy_arm64/il2cpp
          #!/bin/sh
          echo "IL2CPP already compiled on Windows, skipping."
          exit 0
          EOF

          cat << 'EOF' > Il2CppOutputProject/IL2CPP/build/deploy_arm64/bee_backend/mac-arm64/bee_backend
          #!/bin/sh
          echo "Bee backend skipped."
          exit 0
          EOF

          # Cấp toàn bộ quyền thực thi
          chmod +x Il2CppOutputProject/IL2CPP/build/deploy_arm64/il2cpp
          chmod +x Il2CppOutputProject/IL2CPP/build/deploy_arm64/bee_backend/mac-arm64/bee_backend
          find . -name "*.sh" -exec chmod +x {} + 2>/dev/null || true

      - name: Build App
        run: |
          xcodebuild build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package to IPA (Unsigned)
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -n 1)
          fi

          echo "Tìm thấy App tại: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Unity-iPhone.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-iPhone-IPA
          path: Unity-iPhone.ipa

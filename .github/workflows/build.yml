name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract macOS IL2CPP Binaries
        run: |
          echo "Tải bộ Unity iOS Support..."
          curl -L -f "https://download.unity3d.com/download_unity/96770f904ca7/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-2022.3.62f3.pkg" -o /tmp/unity-ios.pkg

          echo "Bung file .pkg..."
          mkdir -p /tmp/pkg_extract
          cd /tmp/pkg_extract
          xar -xf /tmp/unity-ios.pkg

          echo "Giải nén Payload..."
          PAYLOAD_FILE=$(find . -name "Payload" | head -n 1)
          mkdir -p extracted_files
          cd extracted_files
          cat "../$PAYLOAD_FILE" | cpio -idmv > /dev/null 2>&1

          IL2CPP_MAC=$(find . -type d -path "*/PlaybackEngines/iOSSupport/il2cpp" | head -n 1)
          cd "$GITHUB_WORKSPACE"

          if [ -n "$IL2CPP_MAC" ]; then
            mkdir -p Il2CppOutputProject/IL2CPP/build/deploy_arm64
            cp -rf /tmp/pkg_extract/extracted_files/"$IL2CPP_MAC"/build/deploy_arm64/* Il2CppOutputProject/IL2CPP/build/deploy_arm64/ 2>/dev/null || true
            cp -rf /tmp/pkg_extract/extracted_files/"$IL2CPP_MAC"/* Il2CppOutputProject/IL2CPP/ 2>/dev/null || true
          fi

          find Il2CppOutputProject/IL2CPP -type f -exec chmod +x {} + 2>/dev/null || true
          find . -name "*.sh" -exec chmod +x {} + 2>/dev/null || true

      - name: Build App
        run: |
          xcodebuild build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package to IPA (Unsigned)
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -n 1)
          fi

          echo "Tìm thấy: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Unity-iPhone.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-iPhone-IPA
          path: Unity-iPhone.ipa

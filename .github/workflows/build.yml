name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Unity iOS Support (macOS binaries)
        run: |
          echo "Tải bộ Unity iOS Support chuẩn cho Unity 2022.3.62f3..."
          curl -L -f "https://download.unity3d.com/download_unity/96770f904ca7/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-2022.3.62f3.pkg" -o /tmp/unity-ios.pkg
          
          echo "Cài đặt pkg vào máy ảo..."
          sudo installer -pkg /tmp/unity-ios.pkg -target /
          
          echo "Tìm thư mục IL2CPP vừa cài đặt..."
          IL2CPP_DIR=$(find /Applications /opt /Library -type d -path "*/iOSSupport/il2cpp" 2>/dev/null | head -n 1)
          
          if [ -d "$IL2CPP_DIR" ]; then
            echo "Tìm thấy IL2CPP tại: $IL2CPP_DIR"
            mkdir -p Il2CppOutputProject/IL2CPP/build/deploy_arm64
            cp -rf "$IL2CPP_DIR"/build/deploy_arm64/* Il2CppOutputProject/IL2CPP/build/deploy_arm64/ 2>/dev/null || true
            cp -rf "$IL2CPP_DIR"/* Il2CppOutputProject/IL2CPP/ 2>/dev/null || true
          else
            echo "Không tìm thấy thư mục qua installer, thử giải nén trực tiếp..."
            pkgutil --expand-full /tmp/unity-ios.pkg /tmp/expanded
            IL2CPP_BACKUP=$(find /tmp/expanded -type d -name "il2cpp" | head -n 1)
            if [ -d "$IL2CPP_BACKUP" ]; then
              mkdir -p Il2CppOutputProject/IL2CPP/build/deploy_arm64
              cp -rf "$IL2CPP_BACKUP"/build/deploy_arm64/* Il2CppOutputProject/IL2CPP/build/deploy_arm64/ 2>/dev/null || true
              cp -rf "$IL2CPP_BACKUP"/* Il2CppOutputProject/IL2CPP/ 2>/dev/null || true
            fi
          fi
          
          echo "Cấp quyền thực thi..."
          find Il2CppOutputProject/IL2CPP -type f -exec chmod +x {} + 2>/dev/null || true
          find . -name "*.sh" -exec chmod +x {} + 2>/dev/null || true

      - name: Build App
        run: |
          xcodebuild clean build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package to IPA (Unsigned)
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          
          echo "App path found: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Unity-iPhone.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-iPhone-IPA
          path: Unity-iPhone.ipa
